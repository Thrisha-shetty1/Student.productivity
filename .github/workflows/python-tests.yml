
name: StudyBloom Python Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install pytest playwright

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Build Docker image
        run: |
          docker build -t studybloom-test .

      - name: Run Docker container
        run: |
          docker run -d -p 8080:80 --name studybloom studybloom-test

      - name: Wait for website
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8080 > /dev/null; then
              echo "Website is running"
              exit 0
            fi
            sleep 3
          done
          echo "Website failed to start"
          exit 1

      - name: Run Python test cases
        run: |
          python -m pytest tests/test_website.py -v -s

      - name: Stop Docker container
        if: always()
        run: |
          docker stop studybloom || true
          docker rm studybloom || true
